[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-segmentation-yolo"
version = "0.1.0"
description = "SAM3 sky pseudo-labels, reviewed YOLOv8 segmentation datasets, training and inference"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "Pillow>=10,<13",
    "opencv-python>=4.10,<4.12",
    "PyYAML>=6,<7",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3.0,<9"]
test = ["pytest>=8,<9"]

[project.scripts]
skyseg = "skyseg.cli:main"

[tool.setuptools.packages.find]
include = ["skyseg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
